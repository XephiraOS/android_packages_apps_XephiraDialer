plugins {
    id 'base'
}

def apktoolJar = file("tools/apktool.jar")
def signerJar = file("tools/uber-apk-signer.jar")
def outputDir = file("build/outputs/apk/debug")
def unsignedApk = file("${outputDir}/XephiraDialer-unsigned.apk")
def alignedSignedApk = file("${outputDir}/XephiraDialer-aligned-debugSigned.apk")
def signedApk = file("${outputDir}/XephiraDialer-debug.apk")

task ensureApktool {
    doLast {
        if (!apktoolJar.exists()) {
            apktoolJar.parentFile.mkdirs()
            println "Downloading Apktool 2.10.0..."
            ant.get(src: 'https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar', dest: apktoolJar)
        }
    }
}

task ensureSigner {
    doLast {
        if (!signerJar.exists()) {
            signerJar.parentFile.mkdirs()
            println "Downloading uber-apk-signer 1.3.0..."
            ant.get(src: 'https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar', dest: signerJar)
        }
    }
}

task buildUnsignedApk(type: JavaExec) {
    dependsOn ensureApktool
    classpath = files(apktoolJar)
    mainClass = 'brut.apktool.Main'
    args = ['b', projectDir.absolutePath, '-o', unsignedApk.absolutePath]

    doFirst {
        outputDir.mkdirs()
    }
}

task injectCoroutinesServices {
    dependsOn buildUnsignedApk
    doLast {
        def zipFile = unsignedApk
        def env = [create: 'false']
        def uri = java.net.URI.create("jar:" + zipFile.toPath().toUri())
        java.nio.file.FileSystems.newFileSystem(uri, env).withCloseable { fs ->
            def servicesDir = fs.getPath("/META-INF/services")
            java.nio.file.Files.createDirectories(servicesDir)
            
            java.nio.file.Files.write(servicesDir.resolve("kotlinx.coroutines.internal.r"), "kotlinx.coroutines.android.a\n".getBytes("UTF-8"))
            java.nio.file.Files.write(servicesDir.resolve("kotlinx.coroutines.internal.MainDispatcherFactory"), "kotlinx.coroutines.android.a\n".getBytes("UTF-8"))
            java.nio.file.Files.write(servicesDir.resolve("kotlinx.coroutines.C"), "kotlinx.coroutines.android.b\n".getBytes("UTF-8"))
            java.nio.file.Files.write(servicesDir.resolve("kotlinx.coroutines.CoroutineExceptionHandler"), "kotlinx.coroutines.android.b\n".getBytes("UTF-8"))
        }
        println "Injected coroutines MainDispatcherFactory and CoroutineExceptionHandler services into ${zipFile.name}"
    }
}

task signDebugApk(type: JavaExec) {
    dependsOn injectCoroutinesServices, ensureSigner
    classpath = files(signerJar)
    mainClass = 'at.favre.tools.apksigner.SignTool'
    args = [
        '--apks', unsignedApk.absolutePath,
        '-o', outputDir.absolutePath,
        '--allowResign',
        '--verbose'
    ]

    doLast {
        if (alignedSignedApk.exists()) {
            copy {
                from alignedSignedApk
                into outputDir
                rename { 'XephiraDialer-debug.apk' }
            }
            copy {
                from alignedSignedApk
                into file("prebuilt")
                rename { 'XephiraDialer.apk' }
            }
            println "Successfully generated zipaligned and v1/v2/v3 signed APK: ${signedApk.absolutePath}"
        }
    }
}

task assembleDebug {
    dependsOn signDebugApk
    group = 'build'
    description = 'Builds, zipaligns and signs the debug APK with v1/v2/v3 signature schemes'
}

assemble.dependsOn assembleDebug
build.dependsOn assemble
